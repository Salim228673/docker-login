name: Introduction

on:
  - push

jobs:
  intro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout karo Code ko
        uses: actions/checkout@v6.1.0

      - name: Use NodeJS Actions
        uses: actions/setup-node@v7
        with:
          node-version: 16
      - name: check version node
        run: node -v

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ DOCKER_USERNAME }}
          password: ${{ DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: quereshi/first-class-project:latest
